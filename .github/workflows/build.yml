name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk mon-bureau.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mon-bureau-apk
          path: mon-bureau.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest mon-bureau.apk --target "${{ github.sha }}" \
            --title "Mon Bureau 1.${{ github.run_number }}" \
            --notes "Téléchargez mon-bureau.apk ci-dessous et ouvrez-le sur le téléphone pour installer ou mettre à jour."
